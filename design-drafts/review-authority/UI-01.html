<!DOCTYPE html>
<html lang="en" x-data="{
    lang: 'en',
    reason: 'session_expired', // Options: 'session_expired', 'direct_login', 'unauthorized'
    emailInput: 'staff@intrepid.asia',
    isAuthenticating: false,
    returnTo: '/learner/playground/lab-1'
}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promptify - Enterprise Authentication</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Material Symbols & Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Alpine.js CDN for Micro-Interactions -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        m3: {
                            primary: '#0B57D0',
                            'on-primary': '#FFFFFF',
                            'primary-container': '#D3E3FD',
                            'on-primary-container': '#041E49',
                            surface: '#F8FAFC',
                            'surface-container-low': '#F1F5F9',
                            'surface-container-high': '#E2E8F0',
                            'on-surface': '#0F172A',
                            'on-surface-variant': '#475569',
                            outline: '#94A3B8',
                            'outline-variant': '#CBD5E1',
                            error: '#BA1A1A',
                            'error-container': '#FFDAD6',
                            'on-error-container': '#410002'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-size: 20px; vertical-align: middle; }
    </style>
</head>
<body class="bg-m3-surface text-m3-on-surface font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-m3-primary-container">

    <!-- ================================================================= -->
    <!-- TOP MINIMAL APP BAR -->
    <!-- ================================================================= -->
    <header class="w-full max-w-7xl mx-auto px-4 lg:px-8 py-6 flex items-center justify-between">
        <!-- Brand Logo -->
        <a href="/" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-2xl bg-m3-primary text-white flex items-center justify-center font-bold text-xl shadow-md shadow-m3-primary/20 group-hover:scale-105 transition-transform">
                P
            </div>
            <div class="flex flex-col">
                <span class="font-bold text-xl tracking-tight text-m3-on-surface">Promptify</span>
                <span class="text-[11px] font-semibold text-m3-primary tracking-wide">INTREPID ENTERPRISE PORTAL</span>
            </div>
        </a>

        <!-- Locale Switcher -->
        <button @click="lang = lang === 'en' ? 'vi' : 'en'"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-m3-outline-variant bg-white text-xs font-medium text-m3-on-surface-variant hover:bg-m3-surface-container-low transition-colors shadow-sm">
            <span class="material-symbols-outlined text-sm">language</span>
            <span x-text="lang.toUpperCase()"></span>
        </button>
    </header>

    <!-- ================================================================= -->
    <!-- MAIN AUTHENTICATION CONTAINER -->
    <!-- ================================================================= -->
    <main class="flex-1 flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md bg-white rounded-3xl border border-m3-outline-variant p-8 shadow-xl shadow-slate-200/60 space-y-6 relative overflow-hidden">

            <!-- Top Branding Strip -->
            <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-m3-primary via-purple-600 to-emerald-500"></div>

            <!-- Header Title -->
            <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-2xl bg-m3-primary-container text-m3-primary mx-auto flex items-center justify-center shadow-inner">
                    <span class="material-symbols-outlined text-3xl">lock</span>
                </div>
                <h1 class="text-2xl font-extrabold text-m3-on-surface tracking-tight"
                    x-text="lang === 'en' ? 'Enterprise Sign In' : 'Đăng nhập Doanh nghiệp'"></h1>
                <p class="text-xs text-m3-on-surface-variant"
                   x-text="lang === 'en' ? 'Access your Intrepid Department Training Zone' : 'Truy cập Khu vực Đào tạo Phòng ban Intrepid'"></p>
            </div>

            <!-- SESSION EXPIRED / STATE ALERT BANNER -->
            <div>
                <!-- State 1: Session Expired Redirect -->
                <div x-show="reason === 'session_expired'"
                     class="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 flex items-start gap-3 text-xs text-amber-900">
                    <span class="material-symbols-outlined text-amber-600 text-lg mt-0.5">timer</span>
                    <div class="space-y-0.5">
                        <p class="font-bold" x-text="lang === 'en' ? 'Session Expired' : 'Phiên làm việc đã hết hạn'"></p>
                        <p class="text-[11px] text-amber-800 leading-normal"
                           x-text="lang === 'en' ? 'Your security token timed out. Please sign in again to continue your lab.' : 'Mã xác thực đã hết hạn. Vui lòng đăng nhập lại để tiếp tục làm bài.'"></p>
                    </div>
                </div>

                <!-- State 2: Direct Login Notice -->
                <div x-show="reason === 'direct_login'"
                     class="bg-blue-50 border border-blue-200 rounded-2xl p-3.5 flex items-start gap-3 text-xs text-blue-900">
                    <span class="material-symbols-outlined text-m3-primary text-lg mt-0.5">verified_user</span>
                    <div class="space-y-0.5">
                        <p class="font-bold" x-text="lang === 'en' ? 'Single Sign-On Enforced' : 'Yêu cầu Đăng nhập SSO'"></p>
                        <p class="text-[11px] text-blue-800 leading-normal"
                           x-text="lang === 'en' ? 'Strictly restricted to registered @intrepid.asia accounts.' : 'Chỉ áp dụng cho tài khoản Google Workspace @intrepid.asia.'"></p>
                    </div>
                </div>
            </div>

            <!-- TEST TOOLBAR: TOGGLE AUTH STATES (For Testing Prototype) -->
            <div class="bg-m3-surface-container-low p-2 rounded-2xl border border-m3-outline-variant/60 text-[11px] space-y-1">
                <span class="text-m3-outline font-bold uppercase tracking-wider block px-1">Prototype Simulator State:</span>
                <div class="flex gap-1">
                    <button @click="reason = 'session_expired'"
                            :class="reason === 'session_expired' ? 'bg-amber-200 font-bold text-amber-900' : 'bg-white text-m3-on-surface-variant'"
                            class="flex-1 py-1 rounded-lg border border-m3-outline-variant transition-all">
                        Session Expired
                    </button>
                    <button @click="reason = 'direct_login'"
                            :class="reason === 'direct_login' ? 'bg-blue-200 font-bold text-blue-900' : 'bg-white text-m3-on-surface-variant'"
                            class="flex-1 py-1 rounded-lg border border-m3-outline-variant transition-all">
                        Direct Login
                    </button>
                </div>
            </div>

            <!-- EMAIL DOMAIN DETECTION INPUT -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-m3-on-surface flex justify-between">
                    <span x-text="lang === 'en' ? 'Enterprise Email Address:' : 'Email Doanh nghiệp:'"></span>
                    <span class="text-[10px] text-m3-primary font-semibold">Google Workspace</span>
                </label>

                <div class="relative">
                    <input type="email"
                           x-model="emailInput"
                           placeholder="yourname@intrepid.asia"
                           class="w-full pl-10 pr-4 py-3 rounded-2xl border border-m3-outline-variant text-sm text-m3-on-surface focus:outline-none focus:border-m3-primary focus:ring-2 focus:ring-m3-primary-container transition-all">
                    <span class="material-symbols-outlined absolute left-3 top-3.5 text-m3-outline">mail</span>
                </div>

                <!-- Domain Recognition Feedback -->
                <div class="pt-1">
                    <template x-if="emailInput.endsWith('@intrepid.asia')">
                        <div class="flex items-center gap-1.5 text-xs text-emerald-700 font-medium bg-emerald-50 p-2 rounded-xl border border-emerald-200">
                            <span class="material-symbols-outlined text-sm text-emerald-600">check_circle</span>
                            <span>Intrepid Asia SSO Roster Verified</span>
                        </div>
                    </template>
                    <template x-if="emailInput && !emailInput.endsWith('@intrepid.asia')">
                        <div class="flex items-center gap-1.5 text-xs text-m3-error font-medium bg-m3-error-container p-2 rounded-xl border border-red-200">
                            <span class="material-symbols-outlined text-sm">warning</span>
                            <span>Non-Intrepid domain. Will trigger UI-03 Access Denied.</span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- MAIN GOOGLE OAUTH CTA BUTTON -->
            <button @click="
                isAuthenticating = true;
                setTimeout(() => {
                    isAuthenticating = false;
                    if (emailInput.endsWith('@intrepid.asia')) {
                        alert('SSO Verified! Redirecting to Profile Confirmation (UI-02)...');
                    } else {
                        alert('Access Denied: Domain boundary enforced. Redirecting to UI-03 Access Denied View...');
                    }
                }, 1000);
            "
            :disabled="isAuthenticating"
            class="w-full flex items-center justify-center gap-3 bg-white border-2 border-m3-outline-variant hover:border-m3-primary hover:bg-m3-surface-container-low text-m3-on-surface font-semibold py-3.5 px-4 rounded-full shadow-sm hover:shadow transition-all active:scale-[0.99] disabled:opacity-50">

                <template x-if="!isAuthenticating">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        <span x-text="lang === 'en' ? 'Sign in with Intrepid Google Account' : 'Đăng nhập bằng Google Intrepid'"></span>
                    </div>
                </template>

                <template x-if="isAuthenticating">
                    <div class="flex items-center gap-2 text-m3-primary font-semibold">
                        <span class="material-symbols-outlined animate-spin">progress_activity</span>
                        <span>Verifying OAuth Token...</span>
                    </div>
                </template>
            </button>

            <!-- FOOTER NOTICE -->
            <div class="pt-4 border-t border-m3-outline-variant/50 text-center space-y-2">
                <p class="text-[11px] text-m3-on-surface-variant">
                    Protected by Enterprise Row-Level Security (RLS) & GCP OAuth Boundary.
                </p>
                <div class="flex justify-center gap-4 text-[11px] text-m3-primary font-medium">
                    <a href="#" class="hover:underline">Need Access Help?</a>
                    <span>•</span>
                    <a href="#" class="hover:underline">Contact Training Lead</a>
                </div>
            </div>

        </div>
    </main>

    <!-- ================================================================= -->
    <!-- FOOTER -->
    <!-- ================================================================= -->
    <footer class="py-6 text-center text-xs text-m3-on-surface-variant border-t border-m3-outline-variant/40 bg-white">
        <p>© 2026 Promptify x Intrepid Asia. All rights reserved.</p>
    </footer>

</body>
</html>
