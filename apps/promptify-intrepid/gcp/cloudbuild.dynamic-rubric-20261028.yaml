steps:
 - name: gcr.io/cloud-builders/docker
   args: ['build', '-f', 'gcp/Dockerfile.dynamic-rubric-20261028', '-t', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/promptify-intrepid/app:dynamic-rubric-20261028', '.']
 # Read-only check inside the built image: overlay hashes, and the server module graph loads.
 - name: asia-southeast1-docker.pkg.dev/$PROJECT_ID/promptify-intrepid/app:dynamic-rubric-20261028
   entrypoint: sh
   args:
    - -c
    - >-
      cd /app && sha256sum src/services/weightedRubricService.ts src/services/parallelJudgeService.ts src/services/productionServerService.ts src/services/studioValidationService.ts &&
      node --import tsx -e "import('./src/services/cloudRunServer.ts').then(m => console.log('server import ok', typeof m.cloudHandler))"
images:
 - asia-southeast1-docker.pkg.dev/$PROJECT_ID/promptify-intrepid/app:dynamic-rubric-20261028
options:
 logging: CLOUD_LOGGING_ONLY
