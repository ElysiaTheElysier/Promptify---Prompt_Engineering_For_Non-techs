steps:
 - name: gcr.io/cloud-builders/docker
   args: ['build', '-f', 'gcp/Dockerfile.auth-classify-20261031', '-t', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/promptify-intrepid/app:auth-classify-20261031', '.']
 # Read-only check inside the built image: overlay hashes, and the server module graph loads.
 - name: asia-southeast1-docker.pkg.dev/$PROJECT_ID/promptify-intrepid/app:auth-classify-20261031
   entrypoint: sh
   args:
    - -c
    - >-
      cd /app && sha256sum src/services/firebaseServerIdentityService.ts src/services/apiAuthorizationService.ts src/services/productionServerService.ts src/services/rebuildRunService.ts api/product.ts &&
      node --import tsx -e "import('./src/services/cloudRunServer.ts').then(m => console.log('server import ok', typeof m.cloudHandler))"
images:
 - asia-southeast1-docker.pkg.dev/$PROJECT_ID/promptify-intrepid/app:auth-classify-20261031
options:
 logging: CLOUD_LOGGING_ONLY
