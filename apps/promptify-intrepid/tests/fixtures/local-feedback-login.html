<!doctype html><html><head><meta charset="utf-8"><title>Local Firebase login</title></head><body><h1>LOCAL ONLY · Firebase Auth Emulator</h1><p>Synthetic users; no production account or database.</p><form id="login"><label>Test account <select id="email"><option>learner@example.test</option><option>admin@example.test</option><option>instructor@example.test</option><option>head@example.test</option><option>unlisted@example.test</option></select></label><button>Sign in locally</button></form><p id="status"></p><script type="module">
import {initializeApp} from 'firebase/app';import {getAuth,connectAuthEmulator,GoogleAuthProvider,signInWithCredential} from 'firebase/auth';const app=initializeApp({apiKey:'demo-key',projectId:'demo-intrepid',authDomain:'demo-intrepid.firebaseapp.com',appId:'demo-app'});const auth=getAuth(app);connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{const email=document.querySelector('#email').value;await signInWithCredential(auth,GoogleAuthProvider.credential(JSON.stringify({sub:email,email,email_verified:true,name:'Local test'})));location.href='/?ui=02';}catch(e){document.querySelector('#status').textContent=e.message;}};
</script></body></html>
