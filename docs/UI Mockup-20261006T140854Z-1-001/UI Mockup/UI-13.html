<!DOCTYPE html>
<html lang="vi" x-data="{
    lang: 'vi',
    modalOpen: true,
    activeTab: 'upload_file', // 'upload_file', 'drive_link', 'manage_sops'
    selectedDept: 'Brand Solutions & Campaign Ops',
    sopTitle: '',
    versionTag: 'v4.2',
    driveUrl: '',
    isUploading: false,
    uploadProgress: 0,
    uploadSuccess: false,
    dragOver: false,
    departments: [
        'Brand Solutions & Campaign Ops',
        'E-commerce Store Operations',
        'Customer Support & SLA Desk',
        'Commercial & Business Development',
        'Supply Chain & Fulfillment',
        'Finance, Tax & Billing'
    ],
    ingestedSops: [
        { id: 'SOP-01', title: 'SOP-Campaign-Ops-v4.pdf', type: 'PDF', pages: 12, size: '2.4 MB', dept: 'Brand Solutions & Campaign Ops', status: 'synced', lastSync: '2 giờ trước', driveSynced: true },
        { id: 'SOP-02', title: 'Intrepid-Brand-Voice-Guide-2026.md', type: 'Markdown', pages: 5, size: '480 KB', dept: 'Brand Solutions & Campaign Ops', status: 'synced', lastSync: '1 tuần trước', driveSynced: true },
        { id: 'SOP-03', title: 'Ticket-Escalation-SLA-Matrix.xlsx', type: 'Excel', pages: 3, size: '1.1 MB', dept: 'Customer Support & SLA Desk', status: 'synced', lastSync: 'Hôm qua', driveSynced: true }
    ],
    startIngestion() {
        if (this.activeTab === 'upload_file' && !this.sopTitle) {
            this.sopTitle = 'SOP-Thiet-Ke-Campaign-2026.pdf';
        }
        this.isUploading = true;
        this.uploadProgress = 10;

        let interval = setInterval(() => {
            if (this.uploadProgress < 100) {
                this.uploadProgress += 22;
            } else {
                clearInterval(interval);
                this.isUploading = false;
                this.uploadSuccess = true;

                // Add new document to list
                this.ingestedSops.unshift({
                    id: 'SOP-0' + (this.ingestedSops.length + 1),
                    title: this.sopTitle || 'Google-Drive-SOP-Sync-Context.pdf',
                    type: 'PDF',
                    pages: 8,
                    size: '1.8 MB',
                    dept: this.selectedDept,
                    status: 'synced',
                    lastSync: 'Vừa xong',
                    driveSynced: this.activeTab === 'drive_link'
                });

                setTimeout(() => {
                    this.uploadSuccess = false;
                    this.activeTab = 'manage_sops';
                    this.sopTitle = '';
                    this.driveUrl = '';
                    this.uploadProgress = 0;
                }, 1500);
            }
        }, 300);
    }
}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promptify - Department SOP Upload & Context Modal (UI-13)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Material Symbols & Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Alpine.js CDN for Micro-Interactions -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        m3: {
                            primary: '#0B57D0',
                            'on-primary': '#FFFFFF',
                            'primary-container': '#D3E3FD',
                            'on-primary-container': '#041E49',
                            surface: '#F8FAFC',
                            'surface-container-low': '#F1F5F9',
                            'surface-container-high': '#E2E8F0',
                            'on-surface': '#0F172A',
                            'on-surface-variant': '#475569',
                            outline: '#94A3B8',
                            'outline-variant': '#CBD5E1',
                            error: '#BA1A1A',
                            'error-container': '#FFDAD6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-size: 20px; vertical-align: middle; }
    </style>
</head>
<body class="bg-m3-surface text-m3-on-surface font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-m3-primary-container">

<!-- ================================================================= -->
<!-- TOP APP BAR -->
<!-- ================================================================= -->
<header class="bg-white border-b border-m3-outline-variant/60 px-4 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
        <a href="/learner/dashboard" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-m3-surface-container-low text-m3-on-surface-variant">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <span class="font-bold text-sm text-m3-on-surface" x-text="lang === 'en' ? 'Learner Dashboard' : 'Trang trung tâm Học viên'"></span>
        <span class="text-m3-outline">•</span>
        <span class="text-xs text-m3-primary font-semibold flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">upload_file</span>
                <span>UI-13: Department SOP Upload & Context Modal</span>
            </span>
    </div>

    <div class="flex items-center gap-3">
        <button @click="modalOpen = !modalOpen"
                class="px-4 py-1.5 rounded-full bg-m3-primary text-white text-xs font-semibold shadow hover:bg-m3-primary/90 transition-all">
            <span x-text="modalOpen ? (lang === 'en' ? 'Close Modal' : 'Đóng Modal') : (lang === 'en' ? 'Open Ingestion Modal' : 'Mở Modal Cập nhật SOP')"></span>
        </button>
        <button @click="lang = lang === 'en' ? 'vi' : 'en'"
                class="px-2.5 py-1 rounded-full border border-m3-outline-variant text-xs font-medium text-m3-on-surface-variant">
            <span x-text="lang.toUpperCase()"></span>
        </button>
    </div>
</header>

<!-- ================================================================= -->
<!-- MAIN DEMO PAGE BACKGROUND -->
<!-- ================================================================= -->
<main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
    <div class="bg-m3-surface-container-low p-8 rounded-3xl border border-m3-outline-variant/60 text-center space-y-3">
        <span class="material-symbols-outlined text-4xl text-m3-primary">cloud_upload</span>
        <h2 class="text-xl font-bold text-m3-on-surface" x-text="lang === 'en' ? 'Department SOP Context Ingestion Engine' : 'Hệ thống Ingest Học liệu & Quy trình SOP Phòng ban'"></h2>
        <p class="text-xs text-m3-on-surface-variant max-w-lg mx-auto" x-text="lang === 'en' ? 'Upload PDF/Word/Excel SOPs or link Google Drive folders to power Gemini 3.8 Flash RAG grounding in Codelabs.' : 'Tải lên tài liệu SOP thực tế hoặc liên kết Google Drive để cấp dữ liệu ngữ cảnh chuẩn (Ground Truth) cho AI Gemini trong các bài thực hành.'"></p>
    </div>
</main>

<!-- ================================================================= -->
<!-- MODAL / DIALOG OVERLAY: UI-13 SOP UPLOAD & CONTEXT MANAGER -->
<!-- ================================================================= -->
<div x-show="modalOpen"
     x-transition.opacity
     class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 lg:p-6"
     style="display: none;">

    <div @click.away="modalOpen = false"
         class="bg-white w-full max-w-3xl max-h-[90vh] rounded-3xl shadow-2xl border border-m3-outline-variant flex flex-col overflow-hidden relative">

        <!-- MODAL HEADER -->
        <div class="p-6 bg-slate-900 text-white border-b border-slate-800 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-m3-primary text-white flex items-center justify-center font-bold shadow-md">
                    <span class="material-symbols-outlined">folder_open</span>
                </div>
                <div>
                    <h2 class="font-extrabold text-base text-white" x-text="lang === 'en' ? 'Upload Department SOP Context' : 'Cập nhật Tài liệu Quy trình (SOP) Phòng ban'"></h2>
                    <p class="text-xs text-slate-300 font-mono" x-text="lang === 'en' ? 'Ingest ground-truth SOPs for Gemini RAG grounding & Codelab evaluation' : 'Số hóa tài liệu SOP thực tế làm căn cứ chống ảo giác (Anti-Hallucination) cho AI'"></p>
                </div>
            </div>

            <button @click="modalOpen = false" class="text-slate-400 hover:text-white p-1">
                <span class="material-symbols-outlined text-2xl">close</span>
            </button>
        </div>

        <!-- INGESTION METHOD TAB SWITCHER -->
        <div class="bg-m3-surface-container-low border-b border-m3-outline-variant px-6 py-2.5 flex items-center justify-between shrink-0 text-xs font-semibold">
            <div class="flex items-center gap-2">
                <button @click="activeTab = 'upload_file'"
                        :class="activeTab === 'upload_file' ? 'bg-white text-m3-primary shadow font-bold' : 'text-m3-on-surface-variant hover:text-m3-on-surface'"
                        class="px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-sm">upload_file</span>
                    <span x-text="lang === 'en' ? 'Upload File (PDF/Word/Excel)' : 'Tải File trực tiếp (PDF/Word/Excel)'"></span>
                </button>

                <button @click="activeTab = 'drive_link'"
                        :class="activeTab === 'drive_link' ? 'bg-white text-m3-primary shadow font-bold' : 'text-m3-on-surface-variant hover:text-m3-on-surface'"
                        class="px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-sm text-emerald-600">add_to_drive</span>
                    <span x-text="lang === 'en' ? 'Sync Google Drive Link' : 'Sync Google Drive (Service Account)'"></span>
                </button>

                <button @click="activeTab = 'manage_sops'"
                        :class="activeTab === 'manage_sops' ? 'bg-white text-m3-primary shadow font-bold' : 'text-m3-on-surface-variant hover:text-m3-on-surface'"
                        class="px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1.5 relative">
                    <span class="material-symbols-outlined text-sm">library_books</span>
                    <span x-text="lang === 'en' ? 'Active Department SOPs' : 'Danh sách SOP đã Ingest'"></span>
                    <span class="bg-m3-primary text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full" x-text="ingestedSops.length"></span>
                </button>
            </div>

            <span class="text-[10px] font-mono font-bold text-m3-primary bg-blue-50 px-2 py-0.5 rounded border border-blue-200 hidden sm:inline-block">RLS Isolation Active</span>
        </div>

        <!-- MODAL BODY CONTENT -->
        <div class="p-6 overflow-y-auto flex-1 space-y-5">

            <!-- TAB 1: FILE UPLOAD ZONE -->
            <div x-show="activeTab === 'upload_file'" class="space-y-4">

                <!-- Department & Version Mapping Fields -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    <div class="space-y-1">
                        <label class="font-bold text-m3-on-surface block" x-text="lang === 'en' ? 'Target Department Scope:' : 'Phòng ban áp dụng tài liệu:'"></label>
                        <select x-model="selectedDept" class="w-full p-2.5 rounded-xl border border-m3-outline-variant bg-white font-semibold text-m3-on-surface focus:outline-none focus:border-m3-primary">
                            <template x-for="d in departments" :key="d">
                                <option :value="d" x-text="d"></option>
                            </template>
                        </select>
                    </div>

                    <div class="space-y-1">
                        <label class="font-bold text-m3-on-surface block" x-text="lang === 'en' ? 'Document Version / Tag:' : 'Phiên bản / Mã nhận diện SOP:'"></label>
                        <input type="text" x-model="versionTag" placeholder="e.g. SOP-v4.2-2026" class="w-full p-2.5 rounded-xl border border-m3-outline-variant text-xs font-mono focus:outline-none focus:border-m3-primary">
                    </div>
                </div>

                <!-- Drag and Drop Upload Area -->
                <div @dragover.prevent="dragOver = true"
                     @dragleave.prevent="dragOver = false"
                     @drop.prevent="dragOver = false; startIngestion();"
                     :class="dragOver ? 'border-m3-primary bg-m3-primary-container/20' : 'border-m3-outline-variant bg-m3-surface hover:border-m3-primary'"
                     class="border-2 border-dashed rounded-2xl p-8 text-center space-y-3 transition-all cursor-pointer">

                    <div class="w-12 h-12 rounded-full bg-m3-primary-container text-m3-primary mx-auto flex items-center justify-center">
                        <span class="material-symbols-outlined text-2xl">cloud_upload</span>
                    </div>

                    <div class="space-y-1">
                        <p class="font-bold text-sm text-m3-on-surface" x-text="lang === 'en' ? 'Drag & drop SOP document here, or click to browse' : 'Kéo thả file SOP vào đây, hoặc bấm để chọn tệp'"></p>
                        <p class="text-xs text-m3-on-surface-variant" x-text="lang === 'en' ? 'Supports PDF, DOCX, XLSX up to 25 MB' : 'Hỗ trợ định dạng PDF, DOCX, XLSX (Dung lượng tối đa 25MB)'"></p>
                    </div>

                    <button @click="startIngestion()" class="px-4 py-2 rounded-full bg-white border border-m3-outline-variant text-m3-on-surface font-semibold text-xs shadow-sm hover:bg-m3-surface-container-low transition-all">
                        <span x-text="lang === 'en' ? 'Select File from Computer' : 'Chọn File từ máy tính'"></span>
                    </button>
                </div>

            </div>

            <!-- TAB 2: GOOGLE DRIVE LINK SYNC -->
            <div x-show="activeTab === 'drive_link'" class="space-y-4" style="display: none;">

                <div class="bg-blue-50/70 p-4 rounded-2xl border border-blue-200 text-xs text-blue-900 space-y-1.5">
                        <span class="font-bold flex items-center gap-1">
                            <span class="material-symbols-outlined text-sm text-m3-primary">sync</span>
                            <span x-text="lang === 'en' ? 'Automated Google Drive Worker Integration:' : 'Tự động đồng bộ qua Service Account Worker:'"></span>
                        </span>
                    <p class="text-[11px] leading-relaxed opacity-90" x-text="lang === 'en' ? 'Paste a Google Drive file or folder link. Promptify background worker reads and embeds the document context automatically using your enterprise Service Account.' : 'Dán đường dẫn File hoặc Folder Google Drive. Hệ thống sẽ tự động quét và phân tích tài liệu để làm ngữ cảnh chuẩn cho Codelabs.'"></p>
                </div>

                <div class="space-y-2 text-xs">
                    <label class="font-bold text-m3-on-surface block" x-text="lang === 'en' ? 'Google Drive File / Folder URL:' : 'Đường dẫn Google Drive (Public / Enterprise Shared):'"></label>
                    <div class="flex gap-2">
                        <input type="text"
                               x-model="driveUrl"
                               placeholder="https://drive.google.com/file/d/10928347..."
                               class="flex-1 p-2.5 rounded-xl border border-m3-outline-variant text-xs font-mono focus:outline-none focus:border-m3-primary">
                        <button @click="startIngestion()"
                                :disabled="!driveUrl"
                                class="px-5 py-2.5 rounded-xl bg-m3-primary text-white font-semibold text-xs shadow hover:bg-m3-primary/90 transition-all disabled:opacity-50">
                            <span x-text="lang === 'en' ? 'Sync Drive Document' : 'Bắt đầu Sync'"></span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- TAB 3: MANAGE INGESTED SOPS -->
            <div x-show="activeTab === 'manage_sops'" class="space-y-3" style="display: none;">
                <div class="flex items-center justify-between text-xs text-m3-on-surface-variant pb-1">
                    <span class="font-bold text-m3-on-surface" x-text="`Active Department Context (${ingestedSops.length} files)`"></span>
                    <span class="text-[11px] text-m3-outline font-mono">Row-Level Security Active</span>
                </div>

                <div class="space-y-2.5">
                    <template x-for="sop in ingestedSops" :key="sop.id">
                        <div class="p-3.5 bg-m3-surface rounded-2xl border border-m3-outline-variant/70 flex items-center justify-between hover:border-m3-primary transition-all text-xs">

                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-xl bg-blue-100 text-m3-primary font-bold flex items-center justify-center">
                                    <span class="material-symbols-outlined text-lg">description</span>
                                </div>
                                <div>
                                    <p class="font-bold text-m3-on-surface" x-text="sop.title"></p>
                                    <p class="text-[10px] text-m3-on-surface-variant font-mono" x-text="`${sop.pages} pgs • ${sop.size} • ${sop.dept}`"></p>
                                </div>
                            </div>

                            <div class="flex items-center gap-3">
                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center gap-0.5">
                                        <span class="material-symbols-outlined text-[12px]">check_circle</span>
                                        <span>RAG Ready</span>
                                    </span>

                                <button @click="alert(`Removing ${sop.title} from RAG context...`)" class="text-m3-outline hover:text-m3-error transition-colors">
                                    <span class="material-symbols-outlined text-sm">delete</span>
                                </button>
                            </div>

                        </div>
                    </template>
                </div>
            </div>

            <!-- INGESTION PROGRESS TRACKER (VISIBLE WHEN PROCESSING) -->
            <template x-if="isUploading">
                <div class="p-4 bg-m3-primary-container/30 rounded-2xl border border-m3-primary/30 space-y-2 text-xs">
                    <div class="flex items-center justify-between font-bold text-m3-on-primary-container">
                            <span class="flex items-center gap-1.5">
                                <span class="material-symbols-outlined animate-spin text-m3-primary text-sm">progress_activity</span>
                                <span x-text="lang === 'en' ? 'Ingesting Document & Indexing RAG Context...' : 'Đang xử lý tách trang & tạo Index RAG Context...'"></span>
                            </span>
                        <span class="font-mono" x-text="`${uploadProgress}%`"></span>
                    </div>

                    <div class="w-full bg-white h-2 rounded-full overflow-hidden">
                        <div class="bg-m3-primary h-full transition-all duration-300" :style="`width: ${uploadProgress}%`"></div>
                    </div>

                    <p class="text-[10px] text-m3-on-surface-variant font-mono" x-text="lang === 'en' ? 'Extracting page text -> Indexing SOP Page Citations -> Mapping RLS Permissions' : 'Trích xuất văn bản -> Đánh số trang SOP -> Phân quyền RLS theo Doanh nghiệp'"></p>
                </div>
            </template>

            <!-- SUCCESS BANNER -->
            <template x-if="uploadSuccess">
                <div class="p-4 bg-emerald-50 text-emerald-950 rounded-2xl border border-emerald-300 text-xs font-bold flex items-center gap-2">
                    <span class="material-symbols-outlined text-emerald-600 text-lg">check_circle</span>
                    <span x-text="lang === 'en' ? 'SOP Document Ingested & Context Synced Successfully!' : 'Đã nạp tài liệu SOP và đồng bộ ngữ cảnh thành công!'"></span>
                </div>
            </template>

        </div>

        <!-- MODAL FOOTER -->
        <div class="p-4 bg-white border-t border-m3-outline-variant shrink-0 flex items-center justify-between text-xs">
            <span class="text-m3-on-surface-variant text-[11px]" x-text="lang === 'en' ? 'Ingested documents are accessible in UI-05 & UI-08' : 'Tài liệu sau khi ingest sẽ xuất hiện ở Sidebar UI-05 & UI-08'"></span>

            <div class="flex items-center gap-2">
                <button @click="modalOpen = false" class="px-4 py-2 rounded-full border border-m3-outline-variant font-semibold text-m3-on-surface hover:bg-m3-surface-container-low transition-all">
                    <span x-text="lang === 'en' ? 'Close' : 'Đóng Modal'"></span>
                </button>
                <button @click="startIngestion()"
                        x-show="activeTab !== 'manage_sops'"
                        class="px-5 py-2 rounded-full bg-m3-primary text-white font-semibold shadow hover:bg-m3-primary/90 transition-all flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">cloud_sync</span>
                    <span x-text="lang === 'en' ? 'Start Ingestion' : 'Bắt đầu Ingest'"></span>
                </button>
            </div>
        </div>

    </div>
</div>

</body>
</html>
